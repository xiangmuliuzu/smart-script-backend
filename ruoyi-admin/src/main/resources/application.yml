# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat进行HTTP编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    com.smartscript: info
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置（口令仅环境变量）
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms

# token配置（A0-R1 安全：禁止默认密钥；TOKEN_SECRET 缺失时启动失败）
token:
  header: Authorization
  secret: ${TOKEN_SECRET:}
  expireTime: ${TOKEN_EXPIRE_MINUTES:30}

# A3 App 凭证域（变量名与默认上下限；密钥仅环境变量）
app:
  auth:
    env: ${APP_AUTH_ENV:local}
    token-secret: ${APP_TOKEN_SECRET:}
    token-issuer: ${APP_TOKEN_ISSUER:}
    token-audience: ${APP_TOKEN_AUDIENCE:}
    access-token-ttl: ${APP_ACCESS_TOKEN_TTL:1800}
    refresh-token-ttl: ${APP_REFRESH_TOKEN_TTL:1209600}
    redis-key-prefix: ${APP_REDIS_KEY_PREFIX:}
    sms:
      provider: ${SMS_PROVIDER:mock}
      access-key-id: ${SMS_ACCESS_KEY_ID:}
      access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
      sign-name: ${SMS_SIGN_NAME:}
      template-login: ${SMS_TEMPLATE_LOGIN:}
      template-register: ${SMS_TEMPLATE_REGISTER:}
      template-set-password: ${SMS_TEMPLATE_SET_PASSWORD:}
      template-reset-password: ${SMS_TEMPLATE_RESET_PASSWORD:}
      template-change-phone-old: ${SMS_TEMPLATE_CHANGE_PHONE_OLD:}
      template-change-phone-new: ${SMS_TEMPLATE_CHANGE_PHONE_NEW:}
      mock-fixed-code: ${APP_SMS_MOCK_CODE:}
      cooldown-seconds: ${SMS_COOLDOWN_SECONDS:60}
      code-ttl-seconds: ${SMS_CODE_TTL_SECONDS:300}
      max-failed-attempts: ${SMS_MAX_FAILED_ATTEMPTS:5}
      phone-daily-limit: ${SMS_PHONE_DAILY_LIMIT:10}
      ip-hourly-limit: ${SMS_IP_HOURLY_LIMIT:30}
      code-length: ${SMS_CODE_LENGTH:6}
    agreement:
      user-version: ${APP_AGREEMENT_USER_VERSION:1.0.0}
      privacy-version: ${APP_AGREEMENT_PRIVACY_VERSION:1.0.0}
      user-url: ${APP_AGREEMENT_USER_URL:https://example.invalid/app/user-agreement}
      privacy-url: ${APP_AGREEMENT_PRIVACY_URL:https://example.invalid/app/privacy-policy}
      user-title: ${APP_AGREEMENT_USER_TITLE:用户协议}
      privacy-title: ${APP_AGREEMENT_PRIVACY_TITLE:隐私政策}

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain,com.smartscript.platform.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除路径（多个用逗号分隔）
  excludes: /system/notice,/api/v1/auth/**
  # 匹配路径
  urlPatterns: /system/*,/monitor/*,/tool/*
